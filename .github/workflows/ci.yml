name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: olim
          POSTGRES_PASSWORD: olim
          POSTGRES_DB: olim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://olim:olim@localhost:5432/olim

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run checks (ty, ruff, tests)
        run: prek run --all-files --show-diff-on-failure --color=always
