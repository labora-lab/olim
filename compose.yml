x-app: &app
  build: .
  image: olim
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-olim}:${POSTGRES_PASSWORD:-a-very-strong-pwd}@db:5432/${POSTGRES_DB:-olim}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    ARTIFACT_ROOT: /artifacts
  volumes:
    - artifacts:/artifacts

services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a-very-strong-pwd}
      POSTGRES_DB: ${POSTGRES_DB:-olim}
    ports:
      - ${POSTGRES_EXPOSE_PORT:-}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olim}"]
      interval: 5s
      timeout: 3s
      retries: 5

  init:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    <<: *app
    ports:
      - ${API_EXPOSE_PORT:-7543}:8000
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command:
      [
        "celery",
        "-A",
        "olim.worker",
        "worker",
        "-Q",
        "light,heavy",
        "--concurrency",
        "2",
      ]
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  artifacts:
