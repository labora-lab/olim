services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a-very-strong-pwd}
      POSTGRES_DB: ${POSTGRES_DB:-olim}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - target: 5432
        published: ${POSTGRES_EXPOSE_PORT:-}
        protocol: tcp

volumes:
  db-data:
