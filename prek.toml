# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.55" # ty version.
hooks = [
  { id = "ty", args = [ "--isolated" ], always_run = false },
]


[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.20"
hooks = [
    { id = "ruff-check", args = [ "--fix" ] },
    { id = "ruff-format" },
]


[[repos]]
repo = "local"
hooks = [
    { id = "check-blanket-ty-ignore", name = "check-blanket-ty-ignore", entry = '#\s*ty:\s*ignore\s*($|[^\[])', language = "pygrep", types = [ "python" ] },
    { id = "pytest", name = "pytest", entry = "uv run pytest -q -m 'not slow'", language = "system", pass_filenames = false },
]
