{% for col_def in tabbed_cols %}
{% set value = src.get(col_def.column) %}
{% set has_data = value and value | string | trim != '' %}
<button type="button"
    class="flex-header-tab-btn inline-flex items-center px-2.5 py-1 text-xs font-medium rounded-lg border transition-colors
        {% if has_data %}bg-gray-50 text-gray-500 border-gray-200 hover:text-gray-700{% else %}bg-gray-50 text-gray-300 border-gray-100 cursor-not-allowed opacity-60{% endif %}"
    {% if has_data %}onclick="switchFlexPanel('flex-panel-tab-{{ loop.index }}', this)"{% else %}disabled title="{{ _('No data available for this column') }}"{% endif %}>
    {% if col_def.render_as in ['pdf', 'pdf_url'] %}
        <i class="bi bi-file-earmark-pdf mr-1 {% if has_data %}text-red-500{% else %}text-gray-300{% endif %}"></i>
    {% elif col_def.render_as == 'image' %}
        <i class="bi bi-image mr-1 {% if has_data %}text-green-500{% else %}text-gray-300{% endif %}"></i>
    {% elif col_def.render_as == 'html' %}
        <i class="bi bi-code-slash mr-1 {% if has_data %}text-purple-500{% else %}text-gray-300{% endif %}"></i>
    {% elif col_def.render_as == 'json' %}
        <i class="bi bi-braces mr-1 {% if has_data %}text-orange-500{% else %}text-gray-300{% endif %}"></i>
    {% else %}
        <i class="bi bi-file-text mr-1"></i>
    {% endif %}
    {{ col_def.column }}
</button>
{% endfor %}
