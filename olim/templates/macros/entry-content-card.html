{% macro entry_card_header(entry, entry_tab_nav='', datasets=[]) %}
<div class="px-6 py-4 border-b border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900 flex items-center gap-2 flex-wrap">
        <span id="entry-content-label"
              class="flex items-center {% if entry_tab_nav %}cursor-pointer hover:opacity-75 transition-opacity{% endif %}"
              {% if entry_tab_nav %}onclick="switchFlexPanel('flex-panel-content', 'content')"{% endif %}>
            <i class="bi bi-file-richtext text-green-600 mr-2"></i>
            {{ _('Entry Content') }}
            {% if entry %}
            <span class="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                {{ entry.entry_id }}{% if datasets | length > 1 %} ({{ entry.dataset.name }}){% endif %}
            </span>
            {% endif %}
        </span>
        {% if entry_tab_nav %}
            <span class="text-gray-300 select-none mx-1">|</span>
            {{ entry_tab_nav | safe }}
        {% endif %}
    </h3>
</div>
{% endmacro %}
