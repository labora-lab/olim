{% set cols = items_per_line | default(2) %}
<div class="grid gap-2" style="grid-template-columns: repeat({{ cols }}, minmax(0, 1fr));">
    {% for option_value, type, icon, color in label_config %}
    {% set is_selected = option_value in selected_values %}
    {% set helper = helper_map.get(option_value, '') if helper_map is defined else '' %}

    <button type="button"
        onclick="toggleMultipleChoice({{ entry.id }}, {{ label.id }}, '{{ option_value }}', {{ 'true' if (single_select is defined and single_select) else 'false' }})"
        id="{{ option_value | replace(' ', '_') | replace("'", '_') }}_{{ label.id }}"
        data-option-value="{{ option_value }}"
        data-color="{{ color }}"
        data-selected="{{ 'true' if is_selected else 'false' }}"
        {% if helper %}title="{{ helper }}"{% endif %}
        class="mc-option relative inline-flex items-center justify-center px-3 py-2.5 text-sm font-medium rounded-lg border-2 transition-all duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-{{ color }}-200 {% if is_selected %}text-white bg-{{ color }}-600 border-{{ color }}-600 hover:bg-{{ color }}-700 hover:border-{{ color }}-700{% else %}text-gray-700 bg-white border-gray-300 hover:bg-{{ color }}-50 hover:border-{{ color }}-300 hover:text-{{ color }}-700{% endif %}">
        {% if icon %}
        {% if type == 'text' %}
        <span class="mc-main-icon font-bold mr-2{% if not is_selected %} opacity-60{% endif %}">{{ icon }}</span>
        {% else %}
        <i class="mc-main-icon bi bi-{{ icon }} mr-2{% if not is_selected %} opacity-60{% endif %}"></i>
        {% endif %}
        {% endif %}
        <span>{{ option_value }}</span>
        <i class="mc-check-icon bi bi-check-circle-fill ml-2{% if not is_selected %} hidden{% endif %}"></i>
        <i class="mc-circle-icon bi bi-circle ml-2 text-gray-400{% if is_selected %} hidden{% endif %}"></i>
    </button>
    {% endfor %}
</div>

<div class="mt-3">
    <button type="button"
        onclick="clearMultipleChoice({{ entry.id }}, {{ label.id }})"
        class="text-xs text-gray-500 hover:text-red-600 transition-colors duration-200">
        <i class="bi bi-x-circle mr-1"></i>
        {{ _('Clear') }}
    </button>
</div>

<script>
function toggleMultipleChoice(entryId, labelId, optionValue, singleSelect) {
    const labelContainer = document.getElementById('label_' + labelId);
    if (!labelContainer) return;

    const allButtons = labelContainer.querySelectorAll('[data-option-value]');
    let selectedValues = [];

    if (singleSelect) {
        // Single select: only the clicked option is selected
        allButtons.forEach(btn => {
            if (btn.getAttribute('data-option-value') === optionValue) {
                const wasSelected = btn.getAttribute('data-selected') === 'true';
                if (!wasSelected) selectedValues.push(optionValue);
                // If already selected, clicking deselects (selectedValues stays empty)
            }
        });
    } else {
        // Multi-select: toggle clicked, keep others
        allButtons.forEach(btn => {
            const value = btn.getAttribute('data-option-value');
            const isSelected = btn.getAttribute('data-selected') === 'true';
            if (value === optionValue) {
                if (!isSelected) selectedValues.push(value);
            } else if (isSelected) {
                selectedValues.push(value);
            }
        });
    }

    const valueJson = JSON.stringify(selectedValues);
    run_command('add-label', [
        'entry_id=' + entryId,
        'label_id=' + labelId,
        'value=' + encodeURIComponent(valueJson),
        'callback=updateMultipleChoiceUI(' + labelId + ', ' + JSON.stringify(selectedValues) + ');'
    ]);
}

function clearMultipleChoice(entryId, labelId) {
    run_command('add-label', [
        'entry_id=' + entryId,
        'label_id=' + labelId,
        'value=',
        'callback=updateMultipleChoiceUI(' + labelId + ', []);'
    ]);
}

function updateMultipleChoiceUI(labelId, selectedValues) {
    const labelContainer = document.getElementById('label_' + labelId);
    if (!labelContainer) return;

    const allButtons = labelContainer.querySelectorAll('[data-option-value]');
    allButtons.forEach(btn => {
        const value = btn.getAttribute('data-option-value');
        const color = btn.getAttribute('data-color') || 'blue';
        const isSelected = selectedValues.includes(value);

        btn.setAttribute('data-selected', isSelected ? 'true' : 'false');

        const baseClasses = 'mc-option relative inline-flex items-center justify-center px-3 py-2.5 text-sm font-medium rounded-lg border-2 transition-all duration-200 shadow-sm focus:outline-none';
        if (isSelected) {
            btn.className = `${baseClasses} text-white bg-${color}-600 border-${color}-600 hover:bg-${color}-700 hover:border-${color}-700 focus:ring-2 focus:ring-${color}-200`;
        } else {
            btn.className = `${baseClasses} text-gray-700 bg-white border-gray-300 hover:bg-${color}-50 hover:border-${color}-300 hover:text-${color}-700 focus:ring-2 focus:ring-${color}-200`;
        }

        const checkIcon = btn.querySelector('.mc-check-icon');
        const circleIcon = btn.querySelector('.mc-circle-icon');
        const mainIcon = btn.querySelector('.mc-main-icon');

        if (checkIcon) checkIcon.classList.toggle('hidden', !isSelected);
        if (circleIcon) circleIcon.classList.toggle('hidden', isSelected);
        if (mainIcon) mainIcon.classList.toggle('opacity-60', !isSelected);
    });

    if (labelContainer) {
        labelContainer.dataset.filled = selectedValues.length > 0 ? 'true' : 'false';
    }
}
</script>
